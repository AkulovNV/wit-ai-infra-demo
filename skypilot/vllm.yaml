# Сценарий B: open-weight модель на своём GPU. Одна задача, место исполнения выбирает SkyPilot.
# Самостоятельное упражнение, шаги в skypilot/README.md. Синтаксис сверить с текущей документацией SkyPilot и vLLM.
name: lecture-llm

resources:
  accelerators: {L4:1, A10G:1, A100:1}   # любой из списка: оптимизатор берёт самый дешёвый доступный
  ports: 8000
  disk_size: 100

envs:
  MODEL_ID: Qwen/Qwen2.5-7B-Instruct
  VLLM_API_KEY: ""                       # передаётся при запуске: --env VLLM_API_KEY=...

setup: |
  pip install "vllm>=0.10"               # TODO: запинить версию после прогона

run: |
  vllm serve $MODEL_ID --host 0.0.0.0 --port 8000 \
    --max-model-len 8192 --api-key $VLLM_API_KEY \
    --enable-auto-tool-choice --tool-call-parser hermes
