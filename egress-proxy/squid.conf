# Egress proxy: всё, что не в allowlist, запрещено. Allowlist по точному хосту, без wildcard:
# docs.partner-shop.example разрешён, sync.partner-shop.example нет.
http_port 3128
pid_filename none
cache deny all

acl allowlist dstdomain docs.partner-shop.example
acl Safe_ports port 80 443 8080
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !allowlist
http_access allow allowlist
http_access deny all

logformat egress %{%Y-%m-%dT%H:%M:%S}tl src=%>a %Ss/%>Hs %rm %ru
access_log stdio:/var/log/squid/access.log egress
cache_log stdio:/dev/null
shutdown_lifetime 1 seconds
